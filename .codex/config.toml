[mcp_servers.playwright]
command = "npm"
args = ["--prefix", "apps/web", "exec", "--", "playwright-mcp", "--config", "playwright-mcp.config.json"]
enabled_tools = ["browser_navigate", "browser_snapshot", "browser_click", "browser_fill_form", "browser_evaluate", "browser_take_screenshot", "browser_close"]
startup_timeout_sec = 30
tool_timeout_sec = 20
